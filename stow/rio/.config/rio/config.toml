# Rio — ThinkPad X1 Yoga / GNOME Shell 51 Wayland
# Match kitty/ghostty rice. NL font = no ligatures.
# Tuned for rioterm 0.5.28 (https://rioterm.com/docs/config)

confirm-before-quit = false
hide-cursor-when-typing = true

[window]
width = 1200
height = 800
mode = "Windowed"
opacity = 0.95
blur = false
decorations = "Enabled"

[fonts]
size = 13.0
family = "JetBrainsMonoNL Nerd Font"
features = []
use-drawable-chars = true
hinting = true

[fonts.regular]
family = "JetBrainsMonoNL Nerd Font"
style = "Normal"
weight = 400

[fonts.bold]
family = "JetBrainsMonoNL Nerd Font"
style = "Normal"
weight = 700

[fonts.italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Italic"
weight = 400

[fonts.bold-italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Italic"
weight = 700

[cursor]
shape = "block"
blinking = true
blinking-interval = 500

[scroll]
multiplier = 3.0
divider = 1.0

[editor]
program = "nvim"

[navigation]
mode = "Tab"
clickable = true
current-working-directory = true

[renderer]
backend = "Vulkan"
disable-unfocused-render = false

[developer]
log-level = "OFF"
