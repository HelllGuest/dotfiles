# Telemetry / analytics opt-out (session-wide via systemd environment.d + shell).
# Single source: stow/privacy. Applied by privacy-hardener.sh / install.sh.
# Curated from do-not-track-cli + AI/IDE vars for this Arch+GNOME workstation.
# Aggressive/offline blockers intentionally omitted (HF_HUB_OFFLINE, etc.).

# Universal
DO_NOT_TRACK=1
NO_TELEMETRY=1

# AI / coding agents
# WARN: DISABLE_TELEMETRY / DO_NOT_TRACK / CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
# can block Claude Code Remote Control and some feature-flag paths. Remove those
# three if you need Remote Control; keep the rest for privacy.
DISABLE_TELEMETRY=1
DISABLE_ERROR_REPORTING=1
CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY=1
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL=1
ANTHROPIC_TELEMETRY=false
HEADROOM_TELEMETRY=off
GEMINI_TELEMETRY_ENABLED=false
KIMI_DISABLE_TELEMETRY=1
OPENCODE_DISABLE_AUTOUPDATE=1
AITOOLSVSCODE_DISABLETELEMETRY=1
DA_TEST_DISABLE_TELEMETRY=1

# JavaScript / TypeScript
NG_CLI_ANALYTICS=false
ASTRO_TELEMETRY_DISABLED=1
GATSBY_TELEMETRY_DISABLED=1
NEXT_TELEMETRY_DISABLED=1
NUXT_TELEMETRY_DISABLED=1
STORYBOOK_DISABLE_TELEMETRY=1
STRAPI_TELEMETRY_DISABLED=true
TURBO_TELEMETRY_DISABLED=1
MUI_X_TELEMETRY_DISABLED=true
VUE_CLI_TELEMETRY_OPTOUT=1
EXPO_NO_TELEMETRY=1
SLS_TELEMETRY_DISABLED=1
SLS_TRACKING_DISABLED=1
VERCEL_TELEMETRY_DISABLED=1

# Package managers
HOMEBREW_NO_ANALYTICS=1
HOMEBREW_NO_ANALYTICS_THIS_RUN=1
YARN_ENABLE_TELEMETRY=0

# Language runtimes
DOTNET_CLI_TELEMETRY_OPTOUT=1
DOTNET_NOLOGO=1
POWERSHELL_TELEMETRY_OPTOUT=1
GOTELEMETRY=off
MS_GOTOOLCHAIN_TELEMETRY_ENABLED=0
TESTINGPLATFORM_TELEMETRY_OPTOUT=1
BINSTALL_DISABLE_TELEMETRY=true

# Cloud / IaC CLIs
AZURE_CORE_COLLECT_TELEMETRY=0
AZURE_DEV_COLLECT_TELEMETRY=false
FUNCTIONS_CORE_TOOLS_TELEMETRY_OPTOUT=1
SAM_CLI_TELEMETRY=0
CDK_DISABLE_CLI_TELEMETRY=true
CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
CHECKPOINT_DISABLE=1
WRANGLER_SEND_METRICS=false
GH_TELEMETRY=false
STRIPE_CLI_TELEMETRY_OPTOUT=1
PULUMI_SKIP_UPDATE_CHECK=true
SUPABASE_TELEMETRY_DISABLED=1
RAILWAY_NO_TELEMETRY=1

# Data / ML / mobile
HF_HUB_DISABLE_TELEMETRY=1
COCOAPODS_DISABLE_STATS=true
FASTLANE_OPT_OUT_USAGE=YES
HASURA_GRAPHQL_ENABLE_TELEMETRY=false
INFLUXD_REPORTING_DISABLED=true
MEILI_NO_ANALYTICS=true
N8N_DIAGNOSTICS_ENABLED=false
APOLLO_TELEMETRY_DISABLED=1

# Misc CLIs used on this box
STACK_TELEMETRY=0
CHOOSENIM_NO_ANALYTICS=1
ARDUINO_METRICS_ENABLED=false
VAGRANT_CHECKPOINT_DISABLE=1
VAGRANT_BOX_UPDATE_CHECK_DISABLE=1
