# atuin — shell history manager (shared zsh/bash)
# Privacy: no sync, no update phone-home, secrets filtered locally.

dialect = "uk"
auto_sync = false
update_check = false
secrets_filter = true
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_arrow = "session"

style = "compact"
show_preview = true
max_preview_height = 4
show_help = false
invert = false
exit_mode = "return-query"

keymap_mode = "emacs"

# Regexes (unanchored). Prefer flag/assignment forms — avoid bare "password"
# so passwd / password-store still record.
history_filter = [
  "^ls",
  "^ll",
  "^la",
  "^cd",
  "^pwd",
  "^clear",
  "^cl$",
  "^q$",
  "^exit$",
  "^history",
  "(?i)--password(\\s|=|$)",
  "(?i)password=",
  "(?i)--token(\\s|=|$)",
  "(?i)--api[-_]?key(\\s|=|$)",
  "(?i)API_KEY=",
  "(?i)_TOKEN=",
  "(?i)SECRET=",
  "(?i)Bearer [A-Za-z0-9._-]+",
]
