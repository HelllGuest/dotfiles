#!/hint/bash
# User makepkg overlay: x86-64-v3 (see stow/system/etc/makepkg.conf.d/99-x86-64-v3.conf)
if [[ -f /etc/makepkg.conf.d/99-x86-64-v3.conf ]]; then
    # shellcheck disable=1091
    source /etc/makepkg.conf.d/99-x86-64-v3.conf
else
    _overlay="$(readlink -f "${BASH_SOURCE[0]:-${HOME}/.config/pacman/makepkg.conf}" 2>/dev/null || true)"
    _v3=""
    if [[ -n ${_overlay} ]]; then
        _dir="$(cd "$(dirname "${_overlay}")/../../../../system/etc/makepkg.conf.d" 2>/dev/null && pwd || true)"
        _v3="${_dir:+${_dir}/99-x86-64-v3.conf}"
        unset _dir
    fi
    if [[ ! -f ${_v3:-} ]]; then
        _root="$(git -C "$(dirname "${_overlay:-.}")" rev-parse --show-toplevel 2>/dev/null || true)"
        _v3="${_root:+${_root}/stow/system/etc/makepkg.conf.d/99-x86-64-v3.conf}"
    fi
    if [[ -f ${_v3} ]]; then
        # shellcheck disable=1090
        source "${_v3}"
    fi
    unset _overlay _root _v3
fi
