# Rootless Podman storage.
# linux-hardened is built without CONFIG_OVERLAY_FS_UNPRIVILEGED, so the kernel
# refuses overlay mounts in a user namespace. Podman auto-detects fuse-overlayfs
# for image layers, but buildah's build-context overlay (podman build, foxcage)
# only uses it when mount_program is set here. Set on every kernel so the store
# stays consistent when switching between linux, linux-lts and linux-hardened.
# Changing driver/mount_program on an existing store needs: podman system reset

[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev"
