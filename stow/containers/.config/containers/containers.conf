# User defaults for rootless Podman (AI agent / sandbox workstation).
# Hard per-run policy lives in scripts/agent-run.sh (network none, read-only, …).

[engine]
cgroup_manager = "systemd"
events_logger = "journald"

[containers]
# Refuse privilege escalation inside the container by default.
no_new_privileges = true
seccomp_profile = "/usr/share/containers/seccomp.json"

# Rootless default network backend is pasta (see podman info).
# Ad-hoc `podman run` still gets pasta unless --network none.
# Prefer: scripts/agent-run.sh (defaults to --network none).
