# Force GeoClue to use /etc/geolocation only — disable IP/WiFi/modem sources.
# Coords are written by scripts/vpn-location-sync.sh:
#   VPN up (proton0)  → exit-node lat/lon via ipapi.co over the tunnel
#   VPN down          → home from stow/system/etc/geolocation.local (or the placeholder)
# Deploy: scripts/location-setup.sh

[ip]
enable=false

[wifi]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[network-nmea]
enable=false

[static-source]
enable=true
