# Kitty — ThinkPad X1 Yoga / GNOME 50 Wayland
# Colors: default

font_family      JetBrainsMono Nerd Font
font_size        13.0
font_features    JetBrainsMonoNF-Regular     -calt -liga -dlig
font_features    JetBrainsMonoNF-Bold        -calt -liga -dlig
font_features    JetBrainsMonoNF-Italic      -calt -liga -dlig
font_features    JetBrainsMonoNF-BoldItalic  -calt -liga -dlig

text_composition_strategy platform

cursor_shape                 block
cursor_blink_interval        0.5
cursor_stop_blinking_after   5.0

scrollback_lines               50000
scrollback_pager               bat --paging=always --language=bash --style=plain
scrollback_pager_history_size  0

mouse_hide_wait        2.0
url_style              curly
open_url_with          default
detect_urls            yes
copy_on_select         clipboard
strip_trailing_spaces  smart

repaint_delay     8
input_delay       1
sync_to_monitor   yes

enable_audio_bell    no
visual_bell_duration 0.0

remember_window_size   no
initial_window_width   220c
initial_window_height  50c
window_padding_width   8 12
background_opacity     0.95
hide_window_decorations no
wayland_titlebar_color background

tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        1
tab_switch_strategy     previous
active_tab_font_style   bold
inactive_tab_font_style normal

shell_integration enabled
term xterm-kitty
linux_display_server wayland

enabled_layouts tall,fat,grid,horizontal,vertical,stack

kitty_mod ctrl+shift

map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection

map kitty_mod+up scroll_line_up
map kitty_mod+down scroll_line_down
map kitty_mod+page_up scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end scroll_end
map kitty_mod+h show_scrollback
map kitty_mod+g show_last_command_output

map kitty_mod+enter new_window_with_cwd
map kitty_mod+n new_os_window_with_cwd
map kitty_mod+w close_window
map kitty_mod+t new_tab_with_cwd
map kitty_mod+q close_tab
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

map kitty_mod+\ launch --location=vsplit --cwd=current
map kitty_mod+- launch --location=hsplit --cwd=current

map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

map kitty_mod+right next_tab
map kitty_mod+left previous_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5

map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0 change_font_size all 0
map kitty_mod+f5 load_config_file

map kitty_mod+e open_url_with_hints
map kitty_mod+p>f kitten hints --type path --program -
map kitty_mod+p>w kitten hints --type word --program @


