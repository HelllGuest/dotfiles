# foot — ThinkPad X1 Yoga / GNOME Shell 51 Wayland
# Match kitty/ghostty rice

font=JetBrainsMono Nerd Font:size=13:fontfeatures=calt=0:fontfeatures=liga=0:fontfeatures=dlig=0
dpi-aware=no
pad=12x8 center
initial-window-size-chars=120x34
selection-target=clipboard
bold-text-in-bright=no

[bell]
system=no
urgent=no
notify=no
visual=no

[scrollback]
lines=50000
multiplier=3.0

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.95
alpha-mode=default

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+Shift+equal
font-decrease=Control+Shift+minus
font-reset=Control+Shift+0
