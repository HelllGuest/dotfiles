# Crampack Preset for Starship (v1.0.1; Nerd Font Version)
# https://github.com/Noktomezo/CrampackForStarship
# Requires a Nerd Font (preferably with "Propo" variant) to be installed

"$schema" = "https://starship.rs/config-schema.json"

# Palettes: mellow | lush | fervor | blaze

format = "\\[$directory$git_branch$git_metrics$git_status$nodejs$python$rust$golang$cmd_duration$battery\\]$character"
add_newline = false

# Raise from default 500ms: git_metrics/git_status run `git diff`/`git status`
# which can briefly exceed 500ms while the fsmonitor daemon warms up or disk is
# busy, producing "Executing command git timed out" warnings.
command_timeout = 1300

[git_metrics]
added_style = "fg:lime"
deleted_style = "fg:ember"
format = " | [+$added]($added_style)/[-$deleted]($deleted_style)"
disabled = false

[cmd_duration]
min_time = 2000
format = " | [󱦟 $duration](fg:spark)"
show_milliseconds = false

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰁾"
format = " | [$symbol $percentage](fg:surge)"
[[battery.display]]
threshold = 20
style = "fg:ember"
[[battery.display]]
threshold = 50
style = "fg:spark"
[[battery.display]]
threshold = 100
style = "fg:lime"

[nodejs]
format = " | [$symbol($version)](fg:lime)"
symbol = " "
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = []

[python]
format = " | [$symbol$pyenv_prefix($version)](fg:surge)"
symbol = " "
detect_folders = []

[rust]
format = " | [$symbol($version)](fg:ember)"
symbol = " "

[golang]
format = " | [$symbol($version)](fg:frost)"
symbol = " "

[directory]
truncation_symbol = " "
truncation_length = 2
truncate_to_repo = true
style = "fg:frost"
format = "[$path]($style)"

[git_branch]
symbol = ""
style = "fg:spark"
format = " | [[$symbol $branch](fg:spark)]($style)"

[git_status]
format = "$all_status$ahead_behind"
conflicted = " | [ $count](fg:nova)"
ahead = " | [ $count](fg:nova)"
behind = " | [ $count](fg:nova)"
diverged = " | [ $ahead_count  $behind_count](fg:nova)"
untracked = " | [󰞋 $count](fg:nova)"
stashed = " | [󰒲 $count](fg:nova)"
modified = " | [󰏫 $count](fg:nova)"
staged = " | [󰱒 $count](fg:nova)"
renamed = " | [󰁕 $count](fg:nova)"
deleted = " | [󰍵 $count](fg:nova)"

[character]
disabled = false
success_symbol = "[\\$](fg:lime)"
error_symbol = "[\\$](fg:ember)"
vimcmd_symbol = "[\\$](fg:lime)"
vimcmd_replace_one_symbol = "[\\$](fg:iris)"
vimcmd_replace_symbol = "[\\$](fg:iris)"
vimcmd_visual_symbol = "[\\$](fg:spark)"

