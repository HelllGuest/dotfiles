# gnome/dconf/extensions.conf — per-extension settings
# Apply after extensions are installed: dconf load / < gnome/dconf/extensions.conf

[org/gnome/shell/extensions/blur-my-shell]
blur-dash=true
blur-panel=true
blur-overview=true
sigma=15
brightness=0.75
dash-blur-brightness=0.6
panel-blur-brightness=0.7
appfolder-dialog-opacity=0.7
color-and-noise=false
hacks-level=1

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=true
static-blur=true
override-background=true
style-panel=0
sigma=15
brightness=0.8

[org/gnome/shell/extensions/blur-my-shell/overview]
blur=true
style-components=3

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=false

[org/gnome/shell/extensions/caffeine]
enable-fullscreen-inhibit=true
show-indicator=true
indicator-position=0
nightlight-pause=true
restore-state=false
user-enabled=false

[org/gnome/shell/extensions/just-perfection]
panel=true
panel-in-overview=true
activities-button=false
app-menu=false
clock-menu=true
keyboard-layout=false
panel-notification-icon=true
search=true
startup-status=0
theme=false
window-demands-attention-focus=true
window-maximized-on-create=false
workspace-switcher=true
workspace-switcher-should-show=false
top-panel-position=0
panel-size=32
notification-banner-position=2

[org/gnome/shell/extensions/tactile]
col-0=1
col-1=1
col-2=1
row-0=1
row-1=1
gap-size=6
show-tiles=true
tile-shortcut='<Super>t'

[org/gnome/shell/extensions/vitals]
hot-sensors=['__temperature_avg__', '_memory_usage_', '__network-rx_max__']
position-in-panel=2
update-time=3
use-higher-precision=false
show-temperature=true
show-voltage=false
show-fan=false
show-memory=true
show-processor=true
show-system=false
show-network=true
show-storage=false
show-battery=true
fixed-widths=true
hide-icons=false
icon-style=1
battery-slot=0

[org/gnome/shell/extensions/gesture-improvements]
pinch-3-finger-gesture=1
swipe-4-finger-gesture=1
follow-natural-scroll=true
default-overview-gesture-direction=true

[org/gnome/shell/extensions/appindicator]
icon-size=18
icon-brightness=0.0
icon-contrast=0.0
tray-pos='right'

[org/gnome/shell/extensions/nightthemeswitcher/gtk-variants]
enabled=true
day='catppuccin-latte-blue-standard'
night='catppuccin-mocha-blue-standard'

[org/gnome/shell/extensions/nightthemeswitcher/cursor-variants]
enabled=false

[org/gnome/shell/extensions/nightthemeswitcher/icon-variants]
enabled=false

[org/gnome/shell/extensions/nightthemeswitcher/shell-variants]
enabled=false
