# gnome/dconf/extensions.conf — per-extension settings (GNOME Shell 51)
# Apply after extensions are installed: dconf load / < gnome/dconf/extensions.conf

[org/gnome/shell/extensions/just-perfection]
panel=true
panel-in-overview=true
activities-button=false
app-menu=false
clock-menu=true
keyboard-layout=false
panel-notification-icon=true
search=true
startup-status=0
theme=false
window-demands-attention-focus=true
window-maximized-on-create=false
workspace-switcher=true
workspace-switcher-should-show=false
top-panel-position=0
panel-size=32
notification-banner-position=2

[org/gnome/shell/extensions/vitals]
hot-sensors=['__temperature_avg__', '_memory_usage_', '__network-rx_max__']
position-in-panel=2
update-time=3
use-higher-precision=false
show-temperature=true
show-voltage=false
show-fan=false
show-memory=true
show-processor=true
show-system=false
show-network=true
show-storage=false
show-battery=true
fixed-widths=true
hide-icons=false
icon-style=1
battery-slot=0

[org/gnome/shell/extensions/appindicator]
icon-size=18
icon-brightness=0.0
icon-contrast=0.0
tray-pos='right'

[org/gnome/shell/extensions/dash2dock-lite]
animate-icons-unmute=true
animation-bounce-height=0.75
animation-magnify=0.33000000000000002
animation-rise=0.25
animation-spread=0.75
autohide-dash=true
autohide-speed=0.5
border-radius=3.0
debug-visual=false
dock-location=0
dock-padding=0.5
icon-border-radius=3.0
icon-effect=0
icon-shadow=true
icon-size=0.142578125
icon-spacing=0.082677165354330714
items-pullout-angle=0.5
panel-mode=true
preferred-monitor=0
pressure-sense=true
pressure-sense-sensitivity=0.40000000000000002
running-indicator-style=1
scroll-sensitivity=0.40000000000000002
shrink-icons=true

[org/gnome/shell/extensions/blur-my-shell]
settings-version=2

[org/gnome/shell/extensions/blur-my-shell/panel]
brightness=0.6
sigma=30
pipeline='pipeline_default'

[org/gnome/shell/extensions/blur-my-shell/overview]
pipeline='pipeline_default'

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
brightness=0.6
sigma=30
static-blur=true
pipeline='pipeline_default_rounded'
style-dash-to-dock=0

[org/gnome/shell/extensions/blur-my-shell/appfolder]
brightness=0.6
sigma=30

[org/gnome/shell/extensions/caffeine]
user-enabled=true
cli-toggle=false
