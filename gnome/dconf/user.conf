# gnome/dconf/user.conf — GNOME 50 session (ThinkPad X1 Yoga Gen 5)
# Apply: dconf load / < gnome/dconf/user.conf

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='catppuccin-mocha-blue-standard'
icon-theme='Papirus-Dark'
cursor-theme='catppuccin-mocha-dark-cursors'
cursor-size=24
document-font-name='Inter 11'
font-name='Inter 11'
monospace-font-name='JetBrainsMono Nerd Font 11'
font-antialiasing='rgba'
font-hinting='slight'
font-rgba-order='rgb'
clock-show-seconds=false
clock-show-date=true
clock-show-weekday=true
clock-format='24h'
show-battery-percentage=true
enable-animations=true
animation-scale=0.7
toolbar-style='icons'
overlay-scrolling=true
text-scaling-factor=1.0

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
num-workspaces=4
focus-mode='click'
auto-raise=false
visual-bell=false
audible-bell=false
titlebar-font='Inter Bold 11'
action-double-click-titlebar='toggle-maximize'
action-middle-click-titlebar='minimize'
action-right-click-titlebar='menu'

[org/gnome/desktop/wm/keybindings]
close=['<Super>q']
maximize=['<Super>Up']
unmaximize=['<Super>Down']
toggle-fullscreen=['<Super>F11']
switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
move-to-workspace-1=['<Super><Shift>1']
move-to-workspace-2=['<Super><Shift>2']
move-to-workspace-3=['<Super><Shift>3']
move-to-workspace-4=['<Super><Shift>4']
switch-windows=['<Alt>Tab']
switch-windows-backward=['<Alt><Shift>Tab']
switch-applications=['<Super>Tab']
switch-applications-backward=['<Super><Shift>Tab']
move-to-monitor-left=['<Super><Shift>Left']
move-to-monitor-right=['<Super><Shift>Right']
toggle-maximized=['<Super>m']
minimize=['<Super>h']
begin-move=['<Super>F7']
begin-resize=['<Super>F8']
panel-run-dialog=['<Super>r']

[org/gnome/shell/keybindings]
toggle-overview=['<Super>space']
toggle-application-view=['<Super><Shift>space']
focus-active-notification=['<Super>n']
open-new-window-application-1=@as []
open-new-window-application-2=@as []

[org/gnome/mutter]
experimental-features=['scale-monitor-framebuffer']
dynamic-workspaces=true
edge-tiling=true
attach-modal-dialogs=true
center-new-windows=true
workspaces-only-on-primary=false

[org/gnome/mutter/keybindings]
toggle-tiled-left=['<Super>Left']
toggle-tiled-right=['<Super>Right']

[org/gnome/shell]
disable-user-extensions=false
enabled-extensions=['blur-my-shell@aunetx', 'caffeine@patapon.info', 'appindicatorsupport@rgcjonas.gmail.com', 'tactile@lundal.io', 'just-perfection-desktop@just-perfection', 'user-theme@gnome-shell-extensions.gcampax.github.com', 'Vitals@CoreCoding.com', 'gestureImprovements@gestures', 'nightthemeswitcher@romainvigier.fr']
favorite-apps=['kitty.desktop', 'com.mitchellh.ghostty.desktop', 'org.mozilla.firefox.desktop', 'org.gnome.Nautilus.desktop', 'code.desktop']

[org/gnome/shell/app-switcher]
current-workspace-only=false

[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true
two-finger-scrolling-enabled=true
natural-scroll=true
speed=0.2
disable-while-typing=true
click-method='fingers'
send-events='enabled'

[org/gnome/desktop/peripherals/mouse]
natural-scroll=false
speed=0.0
accel-profile='adaptive'

[org/gnome/desktop/peripherals/keyboard]
numlock-state=false
repeat=true
repeat-interval=uint32 25
delay=uint32 200

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='suspend'
sleep-inactive-battery-timeout=900
power-button-action='suspend'
lid-close-ac-action='suspend'
lid-close-battery-action='suspend'
lid-close-suspend-with-external-monitor=false

[org/gnome/desktop/session]
idle-delay=uint32 300

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-schedule-automatic=true
night-light-temperature=uint32 3500
night-light-last-coordinates=(25.2, 55.3)

[org/gnome/desktop/privacy]
report-technical-problems=false
send-software-usage-stats=false
remove-old-trash-files=true
remove-old-temp-files=true
old-files-age=uint32 14
remember-recent-files=true
recent-files-max-age=30

[org/gnome/desktop/search-providers]
disabled=['org.gnome.Contacts.desktop', 'org.gnome.Calculator.desktop', 'org.gnome.clocks.desktop', 'org.gnome.Weather.desktop']
sort-order=['org.gnome.Nautilus.desktop', 'org.gnome.Settings.desktop']

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'
search-filter-time-type='last_modified'
show-hidden-files=false
click-policy='single'

[org/gnome/nautilus/list-view]
default-zoom-level='small'
use-tree-view=true

[org/gnome/nautilus/compression]
default-compression-format='tar.xz'

[org/gnome/TextEditor]
style-scheme='catppuccin_mocha'
style-variant='dark'
show-line-numbers=true
highlight-current-line=true
auto-indent=true
tab-width=uint32 2
use-system-font=false
custom-font='JetBrainsMono Nerd Font 12'

[org/gnome/desktop/a11y/applications]
screen-keyboard-enabled=false

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/']
www=['<Super>b']
home=['<Super>e']
screensaver=['<Super>l']
terminal="'kitty'"

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>Return'
command='kitty'
name='Terminal (kitty)'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super><Shift>Return'
command='ghostty'
name='Terminal (ghostty)'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Super>period'
command='gnome-characters'
name='Characters'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3]
binding='<Super>c'
command="bash -c 'wl-paste | wl-copy'"
name='Clipboard passthrough'
