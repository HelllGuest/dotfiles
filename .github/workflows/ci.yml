name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          git grep -nIE \
            -e '-----BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|sk-ant-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9]{32,}' \
            -- ':!.github/workflows/ci.yml' ':!Makefile' || rc=$?
          if [[ $rc -ne 1 ]]; then
            echo "error: secret scan exited $rc (0=match found, >1=grep error)" >&2
            exit 1
          fi

      - name: Stow inventory freshness
        shell: bash
        run: |
          set -euo pipefail
          diff -u all_stow_files.txt <(bash scripts/list-stow-files.sh)
          # Guard against regenerating with bare find (Cache / foreign extensions)
          if grep -Eiq 'Cache|/CacheStorage/|lazy-lock\.json' all_stow_files.txt; then
            echo "all_stow_files.txt must not list runtime Cache or lazy-lock paths" >&2
            exit 1
          fi

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts system ai desktop security provision builds labs -type f -name '*.sh' -print0)
          bash -n install.sh stow-only.sh uninstall.sh t14s-arch-install/install.sh
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find profiles -type f -name '*.sh' -print0 2>/dev/null || true)

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -x -S warning -s bash \
            install.sh stow-only.sh uninstall.sh t14s-arch-install/install.sh \
            scripts/*.sh scripts/check.d/*.sh \
            provision/scripts/*.sh provision/lib/*.sh \
            system/scripts/*.sh \
            ai/scripts/*.sh ai/lib/*.sh \
            desktop/scripts/*.sh desktop/lib/*.sh \
            security/scripts/*.sh security/lib/*.sh \
            builds/scripts/*.sh \
            profiles/*.sh labs/*/*.sh \
            ai/rules/install.sh ai/rules/bin/agentsync ai/rules/lib/*.sh \
            ai/rules/git-hooks/* stow/git/.config/git/templates/hooks/*

      - name: Script tests
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/*.test.sh; do
            bash "$t"
          done

      - name: Stage A tests (stage-a)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dialog >/dev/null 2>&1 || ! command -v whiptail >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dialog whiptail
          fi
          (
            cd stage-a
            bash tests/host-check.test.sh
            bash tests/smoke.test.sh
            shellcheck -S warning -e SC2015,SC2086,SC2162,SC2034 install.sh
            shellcheck -S warning -e SC2015,SC2086,SC2162,SC2034,SC1090,SC1091,SC2154 lib/*.sh lib/steps/*.sh lib/chroot/*.sh
            shellcheck -S warning tests/host-check.sh tests/host-check.test.sh tests/vm-run.sh tests/vm-bootstrap.sh tests/vm-dual-bootstrap.sh
          )

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Markdown lint
        env:
          CI: "true"
        run: bash scripts/lint-docs.sh

  arch-container:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch container test deps
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed bash git git-delta jq starship stow diffutils findutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Smoke test stow, ai-rules, validate-configs, and drift on Arch
        shell: bash
        run: |
          set -euo pipefail
          useradd -m ci
          cp -a "$PWD" /home/ci/dotfiles
          chown -R ci:ci /home/ci/dotfiles
          su - ci -c '
            set -euo pipefail
            cd ~/dotfiles
            bash ./stow-only.sh
            : > ~/.gitconfig
            bash ai/rules/install.sh
            bash scripts/validate-configs.sh
            bash scripts/check.sh --drift
            bash ./uninstall.sh --dry-run
            bash ./uninstall.sh --yes
          '

  pkg-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Sync Arch package databases
        shell: bash
        run: pacman -Sy --noconfirm --needed curl jq git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify pacman.txt and aur.txt upstream availability
        shell: bash
        run: |
          set -euo pipefail
          source provision/lib/pkg-lists.sh
          fail=0
          while IFS= read -r p; do
            if ! pacman -Si "$p" >/dev/null 2>&1; then
              echo "✗ pacman.txt missing from official repos: $p" >&2
              fail=1
            fi
          done < <(list_entries packages/pacman.txt)

          while IFS= read -r p; do
            if pacman -Si "$p" >/dev/null 2>&1; then
              echo "✗ aur.txt entry promoted to official repos: $p" >&2
              fail=1
            fi
            found="$(curl -fsS --get --data-urlencode "arg[]=$p" https://aur.archlinux.org/rpc/v5/info | jq -r '.resultcount')"
            if [[ $found -lt 1 ]]; then
              echo "✗ aur.txt missing from AUR: $p" >&2
              fail=1
            fi
          done < <(list_entries packages/aur.txt)
          exit "$fail"
