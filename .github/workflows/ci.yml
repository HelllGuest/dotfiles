name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stow inventory freshness
        shell: bash
        run: |
          set -euo pipefail
          diff -u all_stow_files.txt <(bash scripts/list-stow-files.sh)
          # Guard against regenerating with bare find (Cache / foreign extensions)
          if grep -Eiq 'Cache|/CacheStorage/|lazy-lock\.json' all_stow_files.txt; then
            echo "all_stow_files.txt must not list runtime Cache or lazy-lock paths" >&2
            exit 1
          fi

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash -n install.sh stow-only.sh
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find profiles labs -type f -name '*.sh' -print0 2>/dev/null || true)

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -x -S warning -s bash \
            install.sh stow-only.sh \
            scripts/*.sh scripts/lib/*.sh scripts/check.d/*.sh \
            profiles/*.sh labs/*/*.sh \
            ai-rules/install.sh ai-rules/bin/agentsync ai-rules/lib/*.sh \
            ai-rules/git-hooks/* stow/git/.config/git/templates/hooks/*

      - name: Script tests
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/*.test.sh; do
            bash "$t"
          done

      - name: Stage A tests (t14s-arch-install)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dialog >/dev/null 2>&1 || ! command -v whiptail >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dialog whiptail
          fi
          (
            cd t14s-arch-install
            bash tests/host-check.test.sh
            bash tests/smoke.test.sh
            shellcheck -S warning -e SC2015,SC2086,SC2162,SC2034 install.sh
            shellcheck -S warning -e SC2015,SC2086,SC2162,SC2034,SC1090,SC1091,SC2154 lib/*.sh lib/steps/*.sh lib/chroot/*.sh
            shellcheck -S warning tests/host-check.sh tests/host-check.test.sh tests/vm-run.sh tests/vm-bootstrap.sh tests/vm-dual-bootstrap.sh
          )

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Markdown lint
        env:
          CI: "true"
        run: bash scripts/lint-docs.sh
