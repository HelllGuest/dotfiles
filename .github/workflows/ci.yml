name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stow inventory freshness
        shell: bash
        run: |
          set -euo pipefail
          diff -u all_stow_files.txt <(bash scripts/list-stow-files.sh)
          # Guard against regenerating with bare find (Cache / foreign extensions)
          if grep -Eiq 'Cache|/CacheStorage/|lazy-lock\.json' all_stow_files.txt; then
            echo "all_stow_files.txt must not list runtime Cache or lazy-lock paths" >&2
            exit 1
          fi

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash -n install.sh stow-only.sh
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find profiles -type f -name '*.sh' -print0 2>/dev/null || true)

      - name: Script tests
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/*.test.sh; do
            bash "$t"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Markdown lint
        env:
          CI: "true"
        run: bash scripts/lint-docs.sh
