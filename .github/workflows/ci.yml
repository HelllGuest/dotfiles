name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stow inventory freshness
        shell: bash
        run: diff -u all_stow_files.txt <(find stow -type f | sort)

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash -n install.sh stow-only.sh
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find profiles -type f -name '*.sh' -print0 2>/dev/null || true)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Markdown lint
        env:
          CI: "true"
        run: bash scripts/lint-docs.sh
