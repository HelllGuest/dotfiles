# Optional sidecar services for lab-web projects.
# Usage: cd ~/proj && podman-compose -f $DOTFILES/labs/lab-web/compose.yml up -d
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_USER: lab
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lab_pg:/var/lib/postgresql/data
  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  lab_pg:
